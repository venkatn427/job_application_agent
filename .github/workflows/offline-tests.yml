name: Offline regression and provider contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p logs
      - run: python scripts/ai_harness.py --test
      - run: python scripts/ai_harness.py --output output/ai-routes.json
